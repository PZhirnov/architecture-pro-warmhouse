name: "Smart Home"
services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smarthome
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/01-base.sql:ro
      - ./init_db/init_ddl_new_db.sql:/docker-entrypoint-initdb.d/02-ddl.sql:ro
      - ./init_db/init_dml_new_db.sql:/docker-entrypoint-initdb.d/03-dml.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smarthome"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - smarthome-network

  nats:
    image: nats:2.10-alpine
    container_name: smarthome-nats
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    restart: unless-stopped
    networks:
      - smarthome-network          # ← ИСПРАВЛЕНО

  mqtt:
    image: eclipse-mosquitto:2
    container_name: smarthome-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    restart: unless-stopped
    networks:
      - smarthome-network          # ← ИСПРАВЛЕНО

  temperature-api:
    build:
      context: ./temperature_api
      dockerfile: Dockerfile
    container_name: temperature-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - smarthome-network

  app:
    build:
      context: ./go_mono_smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_started
      nats:
        condition: service_started        # ← добавлено, если app использует NATS
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature-api:8081
      - NATS_URL=nats://nats:4222         # ← добавлено, если app использует NATS
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

volumes:
  postgres_data:
  nats_data:          # ← добавлено
  mosquitto_data:     # ← добавлено

networks:
  smarthome-network:
    driver: bridge